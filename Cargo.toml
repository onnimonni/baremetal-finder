[package]
name = "baremetal-finder"
version = "0.1.0"
edition = "2024"
description = "Find the best price/performance bare-metal servers that are in stock right now"
license = "MIT"
repository = "https://github.com/onnimonni/baremetal-finder"
keywords = ["dedicated-server", "bare-metal", "hosting", "duckdb", "scraper"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
duckdb = { version = "1.10506.0", features = ["bundled", "chrono"] }
futures = "0.3.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip", "brotli", "cookies", "query", "multipart"] }
roxmltree = "0.21.1"
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
